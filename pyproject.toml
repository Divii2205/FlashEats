[project]
name = "flasheats"
version = "0.1.0"
description = "FlashEats — FDE Data Foundations: a dependable late-delivery KPI pipeline"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Notebooks are an optional analyst surface, kept out of `dev` so the core
# pipeline install never depends on the much larger jupyter tree.
notebooks = ["jupyter>=1.0", "matplotlib>=3.8"]

[project.scripts]
flasheats = "flasheats.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flasheats"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
